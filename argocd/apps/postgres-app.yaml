
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/agifsofyan/tomodachi-infra.git
    targetRevision: main
    path: kubernetes/infrastructure/postgres

  destination:
    server: https://kubernetes.default.svc
    namespace: tomodachi

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
