apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: kong
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://charts.konghq.com
      chart: kong
      targetRevision: "2.41.1"
      helm:
        releaseName: kong
        valueFiles:
          - $values/kubernetes/infrastructure/kong/values.yaml

    - repoURL: https://github.com/agifsofyan/tomodachi-infra.git
      targetRevision: main
      ref: values
      path: kubernetes/infrastructure/kong
      directory:
        include: "*-ingress.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: kong

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true