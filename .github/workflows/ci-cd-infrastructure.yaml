
name: CI/CD Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "argocd/**"
      - "kubernetes/**"
      - ".github/workflows/ci-cd-infrastructure.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "argocd/**"
      - "kubernetes/**"
      - ".github/workflows/ci-cd-infrastructure.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML linter
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Validate YAML syntax
        run: |
          yamllint \
            -d "{extends: relaxed, rules: {line-length: disable}}" \
            argocd kubernetes

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate Kubernetes manifests
        run: |
          find argocd kubernetes \
            -type f \
            \( -name "*.yaml" -o -name "*.yml" \) \
            ! -name "values.yaml" \
            -print0 \
            | xargs -0 -r kubeconform \
                -strict \
                -ignore-missing-schemas \
                -summary

  deployment:
    name: GitOps Deployment
    runs-on: ubuntu-latest
    needs: validate

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: GitOps deployment information
        run: |
          echo "Infrastructure validation succeeded."
          echo "ArgoCD will detect repository changes and synchronize the cluster."
          echo "No direct Kubernetes credentials are required by this workflow."
