configs:
  params:
    server.insecure: true

  cm:
    resource.customizations: |
      networking.k8s.io/Ingress:
        health.lua: |
          hs = {}
          hs.status = "Healthy"
          hs.message = "Ingress assumed healthy (no external LoadBalancer in local k3d cluster)"
          return hs

server:
  service:
    type: NodePort # ClusterIP # LoadBalancer

controller:
  replicas: 1

repoServer:
  replicas: 1

applicationSet:
  replicas: 1

redis:
  enabled: true

dex:
  enabled: true

notifications:
  enabled: true