
configs:
  params:
    server.insecure: true

  cm:
    resource.customizations: |
      networking.k8s.io/Ingress:
        health.lua: |
          hs = {}
          hs.status = "Healthy"
          hs.message = "Ingress assumed healthy (no external LoadBalancer in local k3d cluster)"
          return hs

server:
  enabled: true
  replicas: 1
  service:
    type: NodePort

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi

applicationSet:
  replicas: 0

redis:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

redis-ha:
  enabled: false

dex:
  enabled: false

notifications:
  enabled: false
