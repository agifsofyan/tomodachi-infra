deployment:
  kong:
    enabled: true

replicaCount: 1

autoscaling:
  enabled: false

image:
  repository: kong
  tag: "3.9.4"
  pullPolicy: IfNotPresent

env:
  database: "off"
  router_flavor: traditional
  log_level: info
  admin_listen: "127.0.0.1:8001"

ingressController:
  enabled: true
  image:
    repository: kong/kubernetes-ingress-controller
    tag: "3.5"

  ingressClass: kong
  createIngressClass: true

  admissionWebhook:
    enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi

proxy:
  enabled: true
  type: ClusterIP

  http:
    enabled: true
    servicePort: 80

  tls:
    enabled: false

admin:
  enabled: false

  # Admin API tetap aktif hanya pada loopback Pod.
  # Service Admin API tidak dibuat.
  http:
    enabled: true
    servicePort: 8001
    containerPort: 8001

  tls:
    enabled: false

manager:
  enabled: false

portal:
  enabled: false

portalapi:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
