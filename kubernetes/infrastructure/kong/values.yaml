deployment:
  kong:
    enabled: true

env:
  database: "off"
  router_flavor: traditional
  log_level: info

  admin_listen: "0.0.0.0:8001"
  admin_gui_listen: "0.0.0.0:8002"

  admin_gui_url: http://admin.kong.local
  admin_gui_api_url: https://kong-kong-admin.kong.svc.cluster.local:8001

ingressController:
  enabled: true
  installCRDs: false
  ingressClass: kong

proxy:
  enabled: true
  type: ClusterIP

  http:
    enabled: true
    servicePort: 80

  tls:
    enabled: false

admin:
  enabled: true
  type: ClusterIP

manager:
  enabled: true
  type: ClusterIP