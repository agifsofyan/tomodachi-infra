apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kong-proxy
  namespace: kong
spec:
  entryPoints:
    - websecure

  routes:
    - kind: Rule
      match: Host(`DOMAIN_REDACTED`)
      services:
        - name: kong-kong-proxy
          port: 80

  tls:
    certResolver: letsencrypt
