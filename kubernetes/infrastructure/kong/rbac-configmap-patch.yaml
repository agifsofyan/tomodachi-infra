apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kong-configmap-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kong-configmap-reader-binding
subjects:
  - kind: ServiceAccount
    name: kong-kong
    namespace: kong
roleRef:
  kind: ClusterRole
  name: kong-configmap-reader
  apiGroup: rbac.authorization.k8s.io