apiVersion: v1
kind: ConfigMap
metadata:
  name: relationship-service-config
  namespace: tomodachi-app
data:
  APP_NAME: "relationship-service"
  APP_VERSION: "1.0.0"
  APP_ENV: "development"

  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  SERVER_READ_TIMEOUT: "10"
  SERVER_WRITE_TIMEOUT: "10"

  DATABASE_HOST: "host.k3d.internal"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "tomodachi-relationship"
  DATABASE_SSL_MODE: "disable"
  DATABASE_TIMEZONE: "Asia/Jakarta"
  DATABASE_MAX_OPEN_CONNS: "25"
  DATABASE_MAX_IDLE_CONNS: "10"
  DATABASE_CONN_MAX_LIFETIME: "300"

  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRY_DAY: "1"

  LOGGER_LEVEL: "debug"