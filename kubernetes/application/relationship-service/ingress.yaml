apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relationship-service-ingress
  namespace: tomodachi
  annotations:
    # kubernetes.io/ingress.class: kong -> annotation kubernetes versi lama

    konghq.com/strip-path: "false"
    konghq.com/protocols: "http,https"
spec:
  ingressClassName: kong # -> annotation kubernetes versi baru

  rules:
    - host: api.tomodachi.local
    - http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: relationship-service
                port:
                  number: 8080

          - path: /api/v1/relationships/friends/request
            pathType: Prefix
            backend:
              service:
                name: relationship-service
                port:
                  number: 8080

          - path: /docs/relationship-service
            pathType: Prefix
            backend:
              service:
                name: relationship-service
                port:
                  number: 8080
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: relationship-service
                port:
                  number: 8080
